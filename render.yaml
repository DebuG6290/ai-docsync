databases:
  - name: docsync-postgres
    databaseName: docsync
    user: docsync
    plan: basic-256mb
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: docsync-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: python -m docsync.web.migrate
    healthCheckPath: /health
    envVars: &common-env
      - key: DATABASE_URL
        fromDatabase:
          name: docsync-postgres
          property: connectionString
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_INSTALLATION_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DOCSYNC_REPOSITORY
        sync: false
      - key: DOCSYNC_MONITORED_BRANCH
        value: master
      - key: DOCSYNC_REVIEW_USERNAME
        sync: false
      - key: DOCSYNC_REVIEW_PASSWORD
        sync: false
      - key: DOCSYNC_BASE_URL
        sync: false
  - type: worker
    name: docsync-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m docsync.web.worker
    envVars: *common-env
