name: DocSync index
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Explicit approved baseline SHA (only before the first index)
        required: true
        default: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
permissions:
  contents: read
  pull-requests: read
jobs:
  index:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: DebuG6290/ai-docsync/.github/workflows/docsync-index.yml@6e5d6449c6d46cea9617c516329ab4f373be7ab1
    with:
      # Workflow and application are pinned to the same reviewed batched-analysis release.
      application_ref: 6e5d6449c6d46cea9617c516329ab4f373be7ab1
      monitored_branch: master
      baseline_sha: ${{ inputs.baseline_sha || '' }}
      retry: ${{ github.run_attempt > 1 }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
