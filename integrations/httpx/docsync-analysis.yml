name: DocSync code change
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  analyze:
    uses: DebuG6290/ai-docsync/.github/workflows/docsync-analysis.yml@d9e6b6257589d6b18b65c5deb9a8b8117a3b0f0b
    with:
      # Workflow and application are pinned to the same reviewed migration release.
      application_ref: d9e6b6257589d6b18b65c5deb9a8b8117a3b0f0b
      monitored_branch: master
      retry: ${{ github.run_attempt > 1 }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
