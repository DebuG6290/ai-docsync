name: DocSync code change
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      before_sha:
        description: Full before SHA of an existing failed analysis (not a new code change)
        required: true
      after_sha:
        description: Full after SHA of that same failed analysis
        required: true
permissions:
  contents: read
jobs:
  analyze:
    uses: DebuG6290/ai-docsync/.github/workflows/docsync-analysis.yml@f40e12ec7555584e3573ecbb7db0878075ddf013
    with:
      # Workflow and application are pinned to the same reviewed UI and lifecycle release.
      application_ref: f40e12ec7555584e3573ecbb7db0878075ddf013
      monitored_branch: master
      retry: ${{ github.event_name == 'workflow_dispatch' || github.run_attempt > 1 }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
