name: DocSync tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docsync
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: docsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docsync -d docsync_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCSYNC_TEST_POSTGRES_URL: postgresql://docsync:test-only-password@localhost:5432/docsync_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
