[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsync"
version = "0.2.0"
description = "Human-approved, online documentation change review and retrieval"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.65,<2",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "fastembed>=0.7,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
docsync = "docsync.cli:main"
docsync-worker = "docsync.web.worker:main"
docsync-migrate = "docsync.web.migrate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["docsync*"]

[tool.setuptools.package-data]
"docsync.web" = ["templates/*.html", "static/*.css"]
"docsync.ui" = ["style.css"]

